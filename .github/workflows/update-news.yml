name: Update news data

on:
  schedule:
    # Runs every 3 hours — covering 100 coins costs far more API calls than
    # the original 6, so this trades a little freshness for staying well
    # within CryptoCompare's rate limits.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Fetch latest headlines from CryptoCompare for every tracked coin
        env:
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
        run: |
          mkdir -p data /tmp/news

          # Pull the current symbol list straight from the price snapshot,
          # so this automatically follows whichever 100 coins are ranked
          # right now rather than a fixed, manually maintained list.
          node -e "
            const fs = require('fs');
            try {
              const coins = JSON.parse(fs.readFileSync('data/coins.json', 'utf8')).coins || {};
              const syms = [...new Set(Object.values(coins).map(c => c.symbol))];
              fs.writeFileSync('/tmp/symbols.txt', syms.join('\n'));
            } catch (e) {
              fs.writeFileSync('/tmp/symbols.txt', '');
            }
          "

          if [ ! -s /tmp/symbols.txt ]; then
            echo "No coins.json data yet — skipping this run."
            exit 0
          fi

          while IFS= read -r symbol; do
            [ -z "$symbol" ] && continue
            curl -sf \
              -H "Authorization: Apikey ${CRYPTOCOMPARE_API_KEY}" \
              "https://min-api.cryptocompare.com/data/v2/news/?lang=EN&categories=${symbol}" \
              -o "/tmp/news/${symbol}.json" || echo "{}" > "/tmp/news/${symbol}.json"
            sleep 0.3
          done < /tmp/symbols.txt

          node -e "
            const fs = require('fs');
            const symbols = fs.readFileSync('/tmp/symbols.txt', 'utf8').split('\n').filter(Boolean);
            const out = { generated_at: new Date().toISOString(), coins: {} };

            for (const symbol of symbols) {
              let items = [];
              try {
                const raw = JSON.parse(fs.readFileSync('/tmp/news/' + symbol + '.json', 'utf8'));
                const articles = (raw.Data || []).slice(0, 6);
                items = articles.map(a => ({
                  title: a.title,
                  url: a.url,
                  source: (a.source_info && a.source_info.name) ? a.source_info.name : a.source,
                  published_on: a.published_on
                }));
              } catch (e) {
                items = [];
              }
              out.coins[symbol] = items;
            }

            fs.writeFileSync('data/news.json', JSON.stringify(out, null, 2) + '\n');
          "

      - name: Commit updated data (if it changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Update news snapshot"
          git push
