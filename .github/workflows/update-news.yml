name: Update news data

on:
  schedule:
    # Runs every 3 hours — covering 100 coins costs far more API calls than
    # the original 6, so this trades a little freshness for staying well
    # within CryptoCompare's rate limits.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Fetch latest headlines for every tracked coin
        env:
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
        run: |
          mkdir -p data /tmp/news /tmp/fallback

          # Pull symbol + name pairs straight from the price snapshot, so
          # this automatically follows whichever 100 coins are ranked
          # right now rather than a fixed, manually maintained list.
          node -e "
            const fs = require('fs');
            try {
              const coins = JSON.parse(fs.readFileSync('data/coins.json', 'utf8')).coins || {};
              const seen = new Set();
              const lines = [];
              for (const c of Object.values(coins)) {
                if (seen.has(c.symbol)) continue;
                seen.add(c.symbol);
                lines.push(c.symbol + '\t' + c.name);
              }
              fs.writeFileSync('/tmp/coin_list.txt', lines.join('\n'));
            } catch (e) {
              fs.writeFileSync('/tmp/coin_list.txt', '');
            }
          "

          if [ ! -s /tmp/coin_list.txt ]; then
            echo "No coins.json data yet — skipping this run."
            exit 0
          fi

          while IFS=$'\t' read -r symbol name; do
            [ -z "$symbol" ] && continue

            # Primary source: CryptoCompare, categorized by ticker.
            curl -sf \
              -H "Authorization: Apikey ${CRYPTOCOMPARE_API_KEY}" \
              "https://min-api.cryptocompare.com/data/v2/news/?lang=EN&categories=${symbol}" \
              -o "/tmp/news/${symbol}.json" || echo "{}" > "/tmp/news/${symbol}.json"
            sleep 0.2

            # Fallback source: cryptocurrency.cv, an open-source, keyless
            # aggregator — searched by coin name for better long-tail
            # coverage on coins CryptoCompare's categories don't cover.
            encoded_name=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$name")
            curl -sf "https://cryptocurrency.cv/api/search?q=${encoded_name}&limit=6" \
              -o "/tmp/fallback/${symbol}.json" || echo "{}" > "/tmp/fallback/${symbol}.json"
            sleep 0.2
          done < /tmp/coin_list.txt

          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('/tmp/coin_list.txt', 'utf8').split('\n').filter(Boolean);
            const out = { generated_at: new Date().toISOString(), coins: {} };

            function briefFrom(raw) {
              const t = (raw || '').replace(/\s+/g, ' ').trim();
              return t.length > 140 ? t.slice(0, 140).trim() + '…' : t;
            }

            for (const line of lines) {
              const symbol = line.split('\t')[0];
              let items = [];

              try {
                const raw = JSON.parse(fs.readFileSync('/tmp/news/' + symbol + '.json', 'utf8'));
                const articles = (raw.Data || []).slice(0, 6);
                items = articles.map(a => ({
                  title: a.title,
                  brief: briefFrom(a.body),
                  url: a.url,
                  source: (a.source_info && a.source_info.name) ? a.source_info.name : a.source,
                  published_on: a.published_on
                }));
              } catch (e) {
                items = [];
              }

              if (!items.length) {
                try {
                  const fb = JSON.parse(fs.readFileSync('/tmp/fallback/' + symbol + '.json', 'utf8'));
                  const articles = (fb.articles || []).slice(0, 6);
                  items = articles.map(a => ({
                    title: a.title,
                    brief: briefFrom(a.description),
                    url: a.link,
                    source: a.source,
                    published_on: a.pubDate ? Math.floor(new Date(a.pubDate).getTime() / 1000) : Math.floor(Date.now() / 1000)
                  }));
                } catch (e) {
                  items = [];
                }
              }

              out.coins[symbol] = items;
            }

            fs.writeFileSync('data/news.json', JSON.stringify(out, null, 2) + '\n');
          "

      - name: Commit updated data (if it changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Update news snapshot"
          git push
